<!DOCTYPE html>
<html lang="en">
<head>
  <title>Image Classifier for piBo</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="../static/all.min.css" type="text/css" />
  <link rel="stylesheet" href="../static/index.css?ver=240701v6" />
  <link rel="shortcut icon" href="../static/icon.png?ver=240319v1" type="image/x-icon" />
  <style>
    header>div>h2>select {
      height: 20.5px;
      background: rgb(248, 242, 172, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      font-size: x-small !important;
      margin-bottom: auto;
    }
  </style>

  <script src="../static/socket.io.min.js"></script>
  <script src="../static/jszip.min.js"></script>
  <script src="../static/tf.min-3.11.0.js"></script>
  <script src="../static/ko2en.js?ver=260903v1"></script>
</head>

<body>
  <!-- 상단 바 -->
  <header class="title">
    <div style="float:left">
      <h2>
        <i class="fa-solid fa-glasses"></i> <span data-key="title">이미지 분류</span>
      </h2>
    </div>
    <div style="float:right">
      <h2 style="display: flex; align-items: center; justify-content: center;">
        <a id="fullscreen_bt" title="Full Screen">
          <span id='fullscreen_txt'></span>
        </a>&nbsp;&nbsp;
        <select id="language" aria-label="language">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>&nbsp;&nbsp;
        <a id='logo_bt'>
          <img src="../static/themaker.png" style="height:22px" alt="" />
        </a>
      </h2>
    </div>
  </header>

  <main>
    <div class="alert-popup" id="alertPopup" style="display:none;">
      <div class="alert-popup-content">
        <p id="alertMessageElement"></p>
        <div class="popup-buttons">
          <button id="alertOkBtn" data-key="ok">확인</button>
        </div>
      </div>
    </div>

    <div class="prompt-popup" id="promptPopup" style="display:none;">
      <div class="prompt-popup-content">
        <p id="promptMessageElement"></p>
        <input type="text" id="promptInputElement" />
        <div class="popup-buttons">
          <button id="promptOkBtn" data-key="ok">확인</button>
          <button id="promptCancelBtn" data-key="cancel">취소</button>
        </div>
      </div>
    </div>

    <div class="confirm-popup" id="confirmPopup" style="display:none;">
      <div class="confirm-popup-content">
        <p id="confirmMessageElement"></p>
        <div class="popup-buttons">
          <button id="confirmOkBtn" data-key="ok">확인</button>
          <button id="confirmCancelBtn" data-key="cancel">취소</button>
        </div>
      </div>
    </div>

    <div class="container">
      <!-- 왼쪽 패널: 클래스 관리 -->
      <div class="left-panel">
        <h2><i class="fas fa-th-list"></i> <span data-key="class_manage">클래스 관리</span></h2>
        <div id="class-management">
          <input type="text" id="class-name" data-key="class_name_ph" placeholder="클래스 이름" onkeydown="if(event.key==='Enter') addClass()">
          <button onclick="addClass()"><i class="fa-solid fa-folder-plus"></i> <span data-key="class_add">클래스 추가</span></button>
        </div>
        <div id="class-list">
          <!-- 동적으로 추가되는 클래스 및 이미지 컬렉션 -->
        </div>
      </div>

      <!-- 중앙 패널: 이미지 학습 -->
      <div class="center-panel">
        <h2><i class="fas fa-camera"></i> <span data-key="image_train">이미지 학습</span></h2>
        <div class="button-group" id="camera-controls">
          <button id="enable-camera-btn" onclick="if(!cameraEnabled){toggleCamera();}"><i class="fas fa-video"></i> <span data-key="cam_on">카메라 켜기</span></button>
          <button id="disable-camera-btn" onclick="if(cameraEnabled){toggleCamera();}"><i class="fas fa-video-slash"></i> <span data-key="cam_off">카메라 끄기</span></button>
          <button id="capture-button" ontouchstart="startCapturingImages(); event.preventDefault();"
            ontouchend="stopCapturingImages()" ontouchcancel="stopCapturingImages()"
            onmousedown="startCapturingImages(); event.preventDefault();" onmouseup="stopCapturingImages()"
            onmouseleave="stopCapturingImages()">
            <i class="fa-solid fa-plus"></i> <span data-key="add_sample">샘플 추가</span>
          </button>
        </div>
        <div id="camera-section">
          <img id="camera" alt="Camera Feed"
            src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z/C/HwAF/gL+eCDUMAAAAABJRU5ErkJggg==" />
        </div>
        <div class="button-group" id="train-controls">
          <button onclick="trainAndPredict()"><i class="fa-solid fa-graduation-cap"></i> <span data-key="train">학습하기</span></button>
        </div>
        <div id="training-params">
          <label for="epochs">
            <p id="epochs-text" data-key="epochs">반복 학습 횟수: </p>
          </label>
          <input type="number" id="epochs" value="15" min="1" max="100">
          <label for="batch-size">
            <p id="batch-text" data-key="batch">한번에 학습할 이미지 수: </p>
          </label>
          <input type="number" id="batch-size" value="32" min="1" max="256">
        </div>
      </div>

      <!-- 오른쪽 패널: 결과 / 예측 -->
      <div class="right-panel">
        <h2><i class="fas fa-laptop"></i> <span data-key="result">결과 및 예측</span></h2>
        <div class="button-group" id="model-controls">
          <button onclick="document.getElementById('model-upload').click()"><i class="fa-solid fa-upload"></i> <span data-key="import_tfjs">불러오기(tfjs)</span></button>
          <button onclick="exportModelAsZip()"><i class="fa-solid fa-download"></i> <span data-key="export_tfjs">내보내기(tfjs)</span></button>
          <button id="convertToH5_bt" onclick="convertToH5()"><i class="fas fa-check"></i> <span data-key="save_keras">mymodel 저장(keras)</span></button>
          <input type="file" id="model-upload" onchange="importModel(event)" style="display:none">
        </div>
        <div id="progress-section">
          <p id="training-progress" data-key="init_wait">초기화 중입니다.</p>
          <progress id="progress-bar" value="0" max="100"></progress>
        </div>
        <div id="prediction-section">
          <h2><i class="fas fa-chart-line"></i> <span data-key="predict_title">예측 결과</span></h2>
          <button id="preview-btn" onclick="setPreviewMode()"><i class="fas fa-eye"></i> <span data-key="preview">미리보기</span></button>
          <button id="inference-btn" onclick="setInferenceMode()"><i class="fas fa-brain"></i> <span data-key="inference">추론하기</span></button>
          <p id="prediction-result" data-key="no_prediction">아직 예측이 없습니다</p>
          <p id="preview-status" data-key="preview_running">(미리보기 실행 중)</p>
        </div>
      </div>
    </div>
  </main>
  <script src="../static/index.js?ver=260903v1"></script>
</body>
</html>
